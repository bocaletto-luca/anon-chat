<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Release v1.0.0 – Update & Upgrade Included -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>AnonChat – Anonymous Multi-User Real-Time Chat</title>
  <meta name="description" content="AnonChat is a lightweight, anonymous multi-user chat app with public and private rooms, built entirely with HTML, CSS & JavaScript.">
  <meta name="keywords" content="anonymous chat, real-time chat, multi-user, private chat, public chat, JSON storage">
  <meta name="author" content="Luca Bocaletto">
  <meta name="version" content="1.0.0">
  <link rel="canonical" href="https://github.com/Bocaletto-Luca/anon-chat">

  <!-- Open Graph -->
  <meta property="og:title" content="AnonChat – Anonymous Multi-User Real-Time Chat">
  <meta property="og:description" content="Join a public room or launch private conversations in this fully front-end anonymous chat.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://github.com/Bocaletto-Luca/anon-chat">
  <meta property="og:image" content="https://raw.githubusercontent.com/Bocaletto-Luca/anon-chat/main/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AnonChat">
  <meta name="twitter:description" content="Anonymous multi-user chat with public & private rooms. No backend required.">

  <!-- Favicon -->
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml">

  <style>
    /* ----- Reset & Base ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; color: #333; }

    /* ----- Utility Classes ----- */
    .hidden { display: none; }
    button { cursor: pointer; }

    /* ----- Authentication Screen ----- */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #auth-container h1 { margin-bottom: 1rem; font-size: 2rem; color: #444444; }
    #auth-container form {
      background: #fafbfc; padding: 1.5rem; margin: 0.5rem; border-radius: 8px;
      width: 300px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    #auth-container label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
    #auth-container input {
      width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cccccc; border-radius: 4px;
    }
    #auth-container button {
      width: 100%; margin-top: 1rem; padding: 0.6rem; background: #5c6bc0; border: none; color: #ffffff; border-radius: 4px;
      font-weight: bold; font-size: 1rem;
    }

    /* ----- Chat Screen ----- */
    #chat-container { display: flex; flex-direction: column; height: 100%; }
    #chat-container header {
      background: #5c6bc0; color: #ffffff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    }
    #chat-container header span { font-weight: bold; }
    #chat-container header button {
      background: #3949ab; border: none; color: #ffffff; padding: 0.5rem 1rem; border-radius: 4px;
    }

    .main {
      display: flex; flex: 1; overflow: hidden;
    }

    /* ----- Online Users Panel ----- */
    #users-list {
      width: 220px; background: #ffffff; border-right: 1px solid #e0e0e0; padding: 1rem; overflow-y: auto;
    }
    #users-list h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #555555; }
    #users-list ul { list-style: none; }
    #users-list li {
      padding: 0.5rem 0.25rem; margin-bottom: 0.25rem; border-radius: 4px;
      transition: background 0.2s; cursor: pointer;
    }
    #users-list li:hover { background: #eceff1; }

    /* ----- Global Chat Panel ----- */
    #global-chat {
      flex: 1; display: flex; flex-direction: column; background: #fafbfc;
    }
    #global-chat .messages {
      flex: 1; padding: 1rem; overflow-y: auto;
    }
    #global-chat .msg {
      margin-bottom: 0.75rem; line-height: 1.4;
    }
    #global-chat .meta {
      font-size: 0.75rem; color: #777777;
    }
    #global-chat form {
      display: flex; border-top: 1px solid #dddddd; background: #ffffff; padding: 0.5rem;
    }
    #global-chat input {
      flex: 1; padding: 0.5rem; border: 1px solid #cccccc; border-radius: 4px;
    }
    #global-chat button {
      margin-left: 0.5rem; padding: 0.5rem 1rem; background: #5c6bc0; border: none; color: #ffffff; border-radius: 4px;
    }

    /* ----- Private Chats Panel ----- */
    #private-chats {
      width: 300px; background: #ffffff; border-left: 1px solid #e0e0e0; padding: 1rem; overflow-y: auto;
    }
    .pm-window {
      border: 1px solid #dddddd; border-radius: 6px; margin-bottom: 1rem; display: flex; flex-direction: column;
    }
    .pm-window header {
      background: #e8eaf6; padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid #dddddd;
    }
    .pm-window .messages {
      flex: 1; max-height: 200px; padding: 0.5rem 1rem; overflow-y: auto; background: #f9f9fb;
    }
    .pm-window .msg {
      margin-bottom: 0.6rem; line-height: 1.3;
    }
    .pm-window form {
      display: flex; border-top: 1px solid #dddddd; padding: 0.5rem 1rem; background: #ffffff;
    }
    .pm-window input {
      flex: 1; padding: 0.4rem; border: 1px solid #cccccc; border-radius: 4px;
    }
    .pm-window button {
      margin-left: 0.5rem; padding: 0.4rem 0.8rem; background: #5c6bc0; border: none; color: #ffffff; border-radius: 4px;
    }

    /* ----- Footer ----- */
    footer {
      text-align: center; padding: 0.75rem 0; background: #f1f3f5; font-size: 0.85rem; color: #555555;
    }
    footer a { color: #5c6bc0; text-decoration: none; font-weight: bold; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Authentication Screen -->
  <div id="auth-container">
    <h1>Welcome to AnonChat</h1>

    <form id="register-form">
      <label for="reg-nick">Choose a Nickname</label>
      <input type="text" id="reg-nick" required />
      <label for="reg-pass">Enter a Password</label>
      <input type="password" id="reg-pass" required />
      <button type="submit">Register</button>
    </form>

    <form id="login-form">
      <label for="log-nick">Your Nickname</label>
      <input type="text" id="log-nick" required />
      <label for="log-pass">Your Password</label>
      <input type="password" id="log-pass" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- Chat Screen -->
  <div id="chat-container" class="hidden">
    <header>
      <div>Logged in as <span id="nick-display"></span></div>
      <button id="logout-btn">Logout</button>
    </header>

    <div class="main">
      <!-- Online Users List -->
      <aside id="users-list">
        <h2>Online Users</h2>
        <ul id="online-ul"></ul>
      </aside>

      <!-- Global Chat Panel -->
      <section id="global-chat">
        <div class="messages" id="global-messages"></div>
        <form id="global-form">
          <input type="text" id="global-input" placeholder="Type a public message..." required />
          <button type="submit">Send</button>
        </form>
      </section>

      <!-- Private Chats Panel -->
      <aside id="private-chats"></aside>
    </div>
  </div>

  <!-- Footer with GitHub Link -->
  <footer>
    © 2025 Luca Bocaletto — <a href="https://github.com/Bocaletto-Luca/anon-chat" target="_blank" rel="noopener">Repo: Bocaletto-Luca/anon-chat</a>  
  </footer>

  <script>
    // Configuration & File Constants
    const FILE_USERS   = 'users.json';
    const FILE_GLOBAL  = 'global.json';
    const FILE_ONLINE  = 'online.json';

    // Application State
    let currentUser = null;
    const pollIntervals = {};

    // Initialize JSON files if missing
    async function initJson(path, initial) {
      try {
        let head = await fetch(path, { method: 'HEAD' });
        if (head.ok) return;
      } catch {}
      await fetch(path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(initial)
      });
    }

    // Read / Write JSON
    async function readJson(path) {
      let resp = await fetch(path);
      if (!resp.ok) throw new Error(`Cannot load ${path}`);
      return resp.json();
    }
    async function writeJson(path, data) {
      await fetch(path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }

    // UUID generator
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        let r = Math.random() * 16 | 0;
        let v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // Timestamp formatter
    function fmt(ts) {
      return new Date(ts).toLocaleTimeString();
    }

    // App Initialization
    async function initApp() {
      await initJson(FILE_USERS,  { users: [] });
      await initJson(FILE_GLOBAL, { messages: [] });
      await initJson(FILE_ONLINE, { online: [] });

      document.getElementById('register-form').addEventListener('submit', onRegister);
      document.getElementById('login-form').addEventListener('submit', onLogin);
      document.getElementById('logout-btn').addEventListener('click', onLogout);
      document.getElementById('global-form').addEventListener('submit', onGlobalSubmit);

      let saved = localStorage.getItem('anonChatUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        enterChat();
      }
    }

    // User Registration
    async function onRegister(e) {
      e.preventDefault();
      let nick = document.getElementById('reg-nick').value.trim();
      let pass = document.getElementById('reg-pass').value;
      let db = await readJson(FILE_USERS);
      if (db.users.some(u => u.nickname === nick)) {
        return alert('That nickname is already taken.');
      }
      let id = uuidv4();
      db.users.push({ id, nickname: nick, password: pass });
      await writeJson(FILE_USERS, db);
      alert('Registered! Please log in.');
      e.target.reset();
    }

    // User Login
    async function onLogin(e) {
      e.preventDefault();
      let nick = document.getElementById('log-nick').value.trim();
      let pass = document.getElementById('log-pass').value;
      let db = await readJson(FILE_USERS);
      let user = db.users.find(u => u.nickname === nick && u.password === pass);
      if (!user) return alert('Invalid credentials.');
      currentUser = user;
      localStorage.setItem('anonChatUser', JSON.stringify(user));
      await addOnlineUser();
      enterChat();
    }

    // User Logout
    async function onLogout() {
      await removeOnlineUser();
      localStorage.removeItem('anonChatUser');
      location.reload();
    }

    // Enter Chat UI
    function enterChat() {
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('chat-container').classList.remove('hidden');
      document.getElementById('nick-display').textContent = currentUser.nickname;
      startPollers();
    }

    // Manage Online Presence
    async function addOnlineUser() {
      let onl = await readJson(FILE_ONLINE);
      if (!onl.online.includes(currentUser.id)) {
        onl.online.push(currentUser.id);
        await writeJson(FILE_ONLINE, onl);
      }
    }
    async function removeOnlineUser() {
      let onl = await readJson(FILE_ONLINE);
      onl.online = onl.online.filter(id => id !== currentUser.id);
      await writeJson(FILE_ONLINE, onl);
    }
    async function pollOnline() {
      let onl = await readJson(FILE_ONLINE);
      let users = await readJson(FILE_USERS);
      let ul = document.getElementById('online-ul');
      ul.innerHTML = '';
      onl.online.forEach(id => {
        if (id === currentUser.id) return;
        let u = users.users.find(x => x.id === id);
        if (!u) return;
        let li = document.createElement('li');
        li.textContent = u.nickname;
        li.dataset.id = id;
        li.addEventListener('click', () => openPrivateChat(id, u.nickname));
        ul.appendChild(li);
      });
    }

    // Global Chat Handlers
    async function onGlobalSubmit(e) {
      e.preventDefault();
      let txt = document.getElementById('global-input').value.trim();
      if (!txt) return;
      let g = await readJson(FILE_GLOBAL);
      g.messages.push({
        id: uuidv4(),
        userId: currentUser.id,
        nickname: currentUser.nickname,
        text: txt,
        timestamp: new Date().toISOString()
      });
      await writeJson(FILE_GLOBAL, g);
      e.target.reset();
    }
    async function pollGlobal() {
      let g = await readJson(FILE_GLOBAL);
      let container = document.getElementById('global-messages');
      container.innerHTML = '';
      g.messages.forEach(m => {
        let div = document.createElement('div');
        div.classList.add('msg');
        div.innerHTML = `<span class="meta">[${fmt(m.timestamp)}] <strong>${m.nickname}:</strong></span>
                         <div>${m.text}</div>`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    // Private Chat Handlers
    function openPrivateChat(targetId, targetNick) {
      let key = `pm-${targetId}`;
      if (pollIntervals[key]) return;
      let panel = document.getElementById('private-chats');
      let win = document.createElement('div');
      win.classList.add('pm-window');
      win.id = key;
      win.innerHTML = `
        <header>${targetNick}</header>
        <div class="messages"></div>
        <form><input type="text" placeholder="Your private message..." required/>
              <button type="submit">Send</button>
        </form>`;
      panel.appendChild(win);

      const myFile = `convs_${currentUser.id}.json`;
      const theirFile = `convs_${targetId}.json`;

      Promise.all([
        initJson(myFile,    { privateChats: {} }),
        initJson(theirFile, { privateChats: {} })
      ]).then(() => {
        win.querySelector('form').addEventListener('submit', ev => {
          ev.preventDefault();
          let text = win.querySelector('input').value.trim();
          if (!text) return;
          sendPrivateMessage(targetId, targetNick, text);
          win.querySelector('input').value = '';
        });
        pollIntervals[key] = setInterval(() => renderPrivateChat(win, targetId), 1000);
      });
    }

    async function renderPrivateChat(win, targetId) {
      let data = await readJson(`convs_${currentUser.id}.json`);
      let conv = data.privateChats[targetId] || [];
      let box = win.querySelector('.messages');
      box.innerHTML = '';
      conv.forEach(m => {
        let div = document.createElement('div');
        div.classList.add('msg');
        let who = m.from === currentUser.id ? 'You' : m.nickname;
        div.innerHTML = `<span class="meta">[${fmt(m.timestamp)}] <strong>${who}:</strong></span>
                         <div>${m.text}</div>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendPrivateMessage(targetId, targetNick, text) {
      let msg = {
        id: uuidv4(),
        from: currentUser.id,
        to: targetId,
        nickname: currentUser.nickname,
        text,
        timestamp: new Date().toISOString()
      };
      let [mine, theirs] = await Promise.all([
        readJson(`convs_${currentUser.id}.json`),
        readJson(`convs_${targetId}.json`)
      ]);
      mine.privateChats[targetId]    = mine.privateChats[targetId]    || [];
      theirs.privateChats[currentUser.id] = theirs.privateChats[currentUser.id] || [];
      mine.privateChats[targetId].push(msg);
      theirs.privateChats[currentUser.id].push(msg);
      await Promise.all([
        writeJson(`convs_${currentUser.id}.json`,    mine),
        writeJson(`convs_${targetId}.json`,          theirs)
      ]);
    }

    // Start Polling Global & Online Lists
    function startPollers() {
      pollGlobal();
      pollOnline();
      pollIntervals.global = setInterval(pollGlobal, 1500);
      pollIntervals.online = setInterval(pollOnline, 2000);
    }

    // Kick things off
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
