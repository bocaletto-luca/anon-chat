<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Anonima Multiutente</title>
  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; color: #333; }

    /* Utilities */
    .hidden { display: none; }
    button { cursor: pointer; }

    /* Auth Screen */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #auth-container h1 { margin-bottom: 1rem; font-size: 2rem; color: #444; }
    #auth-container form {
      background: #fafbfc; padding: 1.5rem; margin: .5rem; border-radius: 8px;
      width: 280px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    #auth-container label { display: block; margin-top: .75rem; font-size: .9rem; }
    #auth-container input {
      width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid #ccc; border-radius: 4px;
    }
    #auth-container button {
      width: 100%; margin-top: 1rem; padding: .6rem; background: #5c6bc0; border: none; color: #fff; border-radius: 4px;
      font-weight: bold;
    }

    /* Chat Screen */
    #chat-container { display: flex; flex-direction: column; height: 100%; }
    #chat-container header {
      background: #5c6bc0; color: #fff; padding: .75rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    }
    #chat-container header span { font-weight: bold; }
    #chat-container header button {
      background: #3949ab; border: none; color: #fff; padding: .5rem 1rem; border-radius: 4px;
    }

    .main {
      display: flex; flex: 1; overflow: hidden;
    }

    /* Online Users */
    #users-list {
      width: 200px; background: #fff; border-right: 1px solid #e0e0e0; padding: 1rem; overflow-y: auto;
    }
    #users-list h2 { font-size: 1.1rem; margin-bottom: .5rem; color: #555; }
    #users-list ul { list-style: none; }
    #users-list li {
      padding: .5rem .25rem; margin-bottom: .25rem; border-radius: 4px;
      transition: background .2s; cursor: pointer;
    }
    #users-list li:hover { background: #eceff1; }

    /* Global Chat */
    #global-chat {
      flex: 1; display: flex; flex-direction: column; background: #fafbfc;
    }
    #global-chat .messages {
      flex: 1; padding: 1rem; overflow-y: auto;
    }
    #global-chat .messages .msg {
      margin-bottom: .75rem; line-height: 1.4;
    }
    #global-chat .messages .meta {
      font-size: .75rem; color: #777;
    }
    #global-chat form {
      display: flex; border-top: 1px solid #ddd; background: #fff; padding: .5rem;
    }
    #global-chat input {
      flex: 1; padding: .5rem; border: 1px solid #ccc; border-radius: 4px;
    }
    #global-chat button {
      margin-left: .5rem; padding: .5rem 1rem; background: #5c6bc0; border: none; color: #fff; border-radius: 4px;
    }

    /* Private Chats */
    #private-chats {
      width: 280px; background: #fff; border-left: 1px solid #e0e0e0; padding: 1rem; overflow-y: auto;
    }
    .pm-window {
      border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1rem; display: flex; flex-direction: column;
    }
    .pm-window header {
      background: #e8eaf6; padding: .5rem 1rem; font-size: .9rem; font-weight: bold; border-bottom: 1px solid #ddd;
    }
    .pm-window .messages {
      flex: 1; max-height: 200px; padding: .5rem 1rem; overflow-y: auto; background: #f9f9fb;
    }
    .pm-window .messages .msg {
      margin-bottom: .6rem; line-height: 1.3;
    }
    .pm-window form {
      display: flex; border-top: 1px solid #ddd; padding: .5rem 1rem; background: #fff;
    }
    .pm-window input {
      flex: 1; padding: .4rem; border: 1px solid #ccc; border-radius: 4px;
    }
    .pm-window button {
      margin-left: .5rem; padding: .4rem .8rem; background: #5c6bc0; border: none; color: #fff; border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Sezione Auth -->
  <div id="auth-container">
    <h1>Chat Anonima Multiutente</h1>
    <form id="register-form">
      <label for="reg-nick">Nickname</label>
      <input type="text" id="reg-nick" required />
      <label for="reg-pass">Password</label>
      <input type="password" id="reg-pass" required />
      <button type="submit">Registrati</button>
    </form>
    <form id="login-form">
      <label for="log-nick">Nickname</label>
      <input type="text" id="log-nick" required />
      <label for="log-pass">Password</label>
      <input type="password" id="log-pass" required />
      <button type="submit">Accedi</button>
    </form>
  </div>

  <!-- Sezione Chat -->
  <div id="chat-container" class="hidden">
    <header>
      <div>Benvenuto, <span id="nick-display"></span></div>
      <button id="logout-btn">Logout</button>
    </header>
    <div class="main">
      <!-- Lista Utenti Online -->
      <aside id="users-list">
        <h2>Online</h2>
        <ul id="online-ul"></ul>
      </aside>

      <!-- Chat Globale -->
      <section id="global-chat">
        <div class="messages" id="global-messages"></div>
        <form id="global-form">
          <input type="text" id="global-input" placeholder="Scrivi un messaggio..." required />
          <button type="submit">Invia</button>
        </form>
      </section>

      <!-- Chat Private -->
      <aside id="private-chats"></aside>
    </div>
  </div>

  <script>
    // Config
    const FILE_USERS   = 'users.json';
    const FILE_GLOBAL  = 'global.json';
    const FILE_ONLINE  = 'online.json';

    // Stato
    let currentUser = null;
    const pollIntervals = {};

    // Utilità JSON
    async function initJson(path, initial) {
      try {
        let res = await fetch(path, { method: 'HEAD' });
        if (!res.ok) throw 0;
      } catch {
        await fetch(path, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(initial)
        });
      }
    }

    async function readJson(path) {
      let res = await fetch(path);
      if (!res.ok) throw new Error(`Impossibile leggere ${path}`);
      return res.json();
    }

    async function writeJson(path, data) {
      await fetch(path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }

    // UUID
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'
        .replace(/[xy]/g, c => {
          let r = Math.random() * 16 | 0;
          let v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
    }

    // Formatta timestamp
    function fmt(ts) {
      return new Date(ts).toLocaleTimeString();
    }

    // Inizializzazione
    async function initApp() {
      // Crea i JSON principali se mancanti
      await initJson(FILE_USERS,  { users: [] });
      await initJson(FILE_GLOBAL, { messages: [] });
      await initJson(FILE_ONLINE, { online: [] });

      // Eventi
      document.getElementById('register-form').addEventListener('submit', onRegister);
      document.getElementById('login-form').addEventListener('submit', onLogin);
      document.getElementById('logout-btn').addEventListener('click', onLogout);
      document.getElementById('global-form').addEventListener('submit', onGlobalSubmit);

      // Se già loggato
      const saved = localStorage.getItem('chatUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        enterChat();
      }
    }

    // Registrazione
    async function onRegister(e) {
      e.preventDefault();
      let nick = document.getElementById('reg-nick').value.trim();
      let pass = document.getElementById('reg-pass').value;
      let db = await readJson(FILE_USERS);
      if (db.users.some(u => u.nickname === nick)) {
        return alert('Nickname già in uso');
      }
      let id = uuidv4();
      db.users.push({ id, nickname: nick, password: pass });
      await writeJson(FILE_USERS, db);
      alert('Registrazione avvenuta con successo. Effettua il login.');
      document.getElementById('register-form').reset();
    }

    // Login
    async function onLogin(e) {
      e.preventDefault();
      let nick = document.getElementById('log-nick').value.trim();
      let pass = document.getElementById('log-pass').value;
      let db = await readJson(FILE_USERS);
      let user = db.users.find(u => u.nickname === nick && u.password === pass);
      if (!user) return alert('Credenziali errate');
      currentUser = user;
      localStorage.setItem('chatUser', JSON.stringify(user));
      await addOnlineUser();
      enterChat();
    }

    // Logout
    async function onLogout() {
      await removeOnlineUser();
      localStorage.removeItem('chatUser');
      location.reload();
    }

    // Entra in chat
    function enterChat() {
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('chat-container' ).classList.remove('hidden');
      document.getElementById('nick-display').textContent = currentUser.nickname;
      startPollers();
    }

    // Online management
    async function addOnlineUser() {
      let onl = await readJson(FILE_ONLINE);
      if (!onl.online.includes(currentUser.id)) {
        onl.online.push(currentUser.id);
        await writeJson(FILE_ONLINE, onl);
      }
    }
    async function removeOnlineUser() {
      let onl = await readJson(FILE_ONLINE);
      onl.online = onl.online.filter(id => id !== currentUser.id);
      await writeJson(FILE_ONLINE, onl);
    }
    async function pollOnline() {
      let onl = await readJson(FILE_ONLINE);
      let db  = await readJson(FILE_USERS);
      let ul  = document.getElementById('online-ul');
      ul.innerHTML = '';
      onl.online.forEach(id => {
        if (id === currentUser.id) return;
        let user = db.users.find(u => u.id === id);
        if (!user) return;
        let li = document.createElement('li');
        li.textContent = user.nickname;
        li.dataset.id = id;
        li.addEventListener('click', () => openPM(id, user.nickname));
        ul.appendChild(li);
      });
    }

    // Global chat
    async function onGlobalSubmit(e) {
      e.preventDefault();
      let text = document.getElementById('global-input').value.trim();
      if (!text) return;
      let g = await readJson(FILE_GLOBAL);
      g.messages.push({
        id: uuidv4(),
        userId: currentUser.id,
        nickname: currentUser.nickname,
        text,
        timestamp: new Date().toISOString()
      });
      await writeJson(FILE_GLOBAL, g);
      document.getElementById('global-input').value = '';
    }
    async function pollGlobal() {
      let g = await readJson(FILE_GLOBAL);
      let container = document.getElementById('global-messages');
      container.innerHTML = '';
      g.messages.forEach(m => {
        let div = document.createElement('div');
        div.classList.add('msg');
        div.innerHTML = `<span class="meta">[${fmt(m.timestamp)}] <strong>${m.nickname}:</strong></span>
                         <div>${m.text}</div>`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    // Private chat
    function openPM(targetId, targetNick) {
      let key = `pm-${targetId}`;
      if (pollIntervals[key]) return; // già aperto
      let pc = document.getElementById('private-chats');
      // Crea finestra PM
      let win = document.createElement('div');
      win.classList.add('pm-window');
      win.id = key;
      win.innerHTML = `
        <header>${targetNick}</header>
        <div class="messages"></div>
        <form>
          <input type="text" placeholder="Messaggio..." required />
          <button type="submit">Invia</button>
        </form>`;
      pc.appendChild(win);

      // Init file convs
      const myFile = `convs_${currentUser.id}.json`;
      const theirFile = `convs_${targetId}.json`;
      Promise.all([
        initJson(myFile,    { privateChats: {} }),
        initJson(theirFile, { privateChats: {} })
      ]).then(() => {
        // Form submit
        win.querySelector('form').addEventListener('submit', ev => {
          ev.preventDefault();
          let txt = win.querySelector('input').value.trim();
          if (!txt) return;
          sendPM(targetId, targetNick, txt);
          win.querySelector('input').value = '';
        });
        // Polling
        pollIntervals[key] = setInterval(() => renderPM(win, targetId), 1000);
      });
    }

    async function renderPM(win, targetId) {
      let data = await readJson(`convs_${currentUser.id}.json`);
      let conv = (data.privateChats[targetId] || []);
      let msgs = win.querySelector('.messages');
      msgs.innerHTML = '';
      conv.forEach(m => {
        let div = document.createElement('div');
        div.classList.add('msg');
        let who = m.from === currentUser.id ? 'Tu' : m.nickname;
        div.innerHTML = `<span class="meta">[${fmt(m.timestamp)}] <strong>${who}:</strong></span>
                         <div>${m.text}</div>`;
        msgs.appendChild(div);
      });
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function sendPM(targetId, targetNick, text) {
      let msg = {
        id: uuidv4(),
        from: currentUser.id,
        to: targetId,
        nickname: currentUser.nickname,
        text,
        timestamp: new Date().toISOString()
      };
      // Carica entrambi i file
      let [mine, theirs] = await Promise.all([
        readJson(`convs_${currentUser.id}.json`),
        readJson(`convs_${targetId}.json`)
      ]);
      mine.privateChats[targetId]    = mine.privateChats[targetId]    || [];
      theirs.privateChats[currentUser.id] = theirs.privateChats[currentUser.id] || [];
      mine.privateChats[targetId].push(msg);
      theirs.privateChats[currentUser.id].push(msg);
      // Scrivi indietro
      await Promise.all([
        writeJson(`convs_${currentUser.id}.json`,    mine),
        writeJson(`convs_${targetId}.json`,          theirs)
      ]);
    }

    // Avvia polling
    function startPollers() {
      pollGlobal();
      pollOnline();
      pollIntervals.global = setInterval(pollGlobal, 1500);
      pollIntervals.online = setInterval(pollOnline, 2000);
    }

    // Kickoff
    document.addEventListener('DOMContentLoaded', initApp);
  </script>

</body>
</html>
